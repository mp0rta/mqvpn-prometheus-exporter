version: 2

project_name: mqvpn-prometheus-exporter

before:
  hooks:
    - go mod download

builds:
  - id: mqvpn-prometheus-exporter
    main: .
    binary: mqvpn-prometheus-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.exporterVersion={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Annotated tags carry hand-written release notes; the per-commit
  # auto-changelog goreleaser would generate from `git log` is noisier
  # and duplicates that prose. Skip it and let the tag message stand.
  disable: true

release:
  draft: false
  prerelease: auto
  # Don't overwrite an existing release body if one was already written
  # (manually via web UI, or by the `gh release create` step in CI).
  mode: keep-existing
